name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a quick follow-up commit makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The smoke test runs under Node on purpose — see scripts/smoke.mjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p packages/sketchy-blobatar/tsconfig.json --noEmit

      - name: Tests
        run: bun --filter sketchy-blobatar test

      - name: Size budgets
        run: bun --filter sketchy-blobatar size

      # `probe-compose.ts` warns and exits 0 when it finds no browser, so that a
      # local run without one is not a hard stop. In CI that would turn the only
      # check that can see a CSS-versus-geometry divergence into a silent pass,
      # so both engines are asserted present before it runs.
      - name: Assert both engines are on the runner
        run: |
          google-chrome --version
          firefox --version

      - name: Composition gate
        run: bun --filter sketchy-blobatar probe

      - name: Build
        run: bun --filter sketchy-blobatar build

      # Links the built package under Node, through its own `exports` map. This
      # is the step that catches a dist that is broken for everyone outside Bun.
      - name: Smoke the built package
        run: bun --filter sketchy-blobatar smoke

      - name: Pack
        run: npm pack --workspace sketchy-blobatar --pack-destination /tmp

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: /tmp/sketchy-blobatar-*.tgz
          retention-days: 7

  apps:
    name: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The apps resolve `sketchy-blobatar/*` to source through tsconfig paths, so this
      # builds the library from source as a side effect — which is the point: it
      # is the check that an alias and the package's `exports` have not drifted
      # apart into two different libraries.
      - name: Build the site
        run: bun run build:site
