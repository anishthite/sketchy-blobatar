name: Release

# Publishing is deliberately manual and tag-driven rather than "on push to
# main": an npm version cannot be unpublished after 72 hours, so the decision to
# ship one should be an explicit act.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the workflow signs the published tarball
      # with an OIDC token, and npm shows the commit and workflow it came from.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # setup-node ships npm 10 with Node 22, and OIDC trusted publishing —
      # which is how this package authenticates, there is no NPM_TOKEN — landed
      # in npm 11.5.1. On the older client `npm publish` does not even attempt
      # the token exchange; it fails with ENEEDAUTH as if no credentials were
      # configured at all, which is a misleading way to learn this.
      - name: npm new enough to exchange the OIDC token
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Tests
        run: bun --filter sketchy-blobatar test

      - name: Size budgets
        run: bun --filter sketchy-blobatar size

      - name: Build
        run: bun --filter sketchy-blobatar build

      - name: Smoke the built package
        run: bun --filter sketchy-blobatar smoke

      - name: Refuse to publish a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/sketchy-blobatar/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
        if: github.event_name == 'push'

      # npm, not bun: `bun publish` does not yet emit provenance attestations.
      #
      # No NODE_AUTH_TOKEN. The package is published through npm's trusted
      # publisher for this repo and this workflow file, so the credential is the
      # OIDC token `id-token: write` above mints — there is no long-lived npm
      # token in this repo to leak or rotate. Renaming this file breaks the
      # trust: the publisher is registered against `release.yml` by name.
      - name: Publish
        run: npm publish --workspace sketchy-blobatar --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
