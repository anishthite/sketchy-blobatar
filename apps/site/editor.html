<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      A second document rather than a client-side route on the landing page,
      and the reason is measurable. `build.ts` rewrites `index.html` around one
      number — nothing renders until the bundle arrives — and its own note says
      ~51 KB of that bundle is already tuning UI nobody scrolling the page ever
      opens. An editor routed into the same bundle would put a slider, twenty
      controls and a live layout readback in front of every visitor who never
      asked for them. Two entrypoints means two bundles, and the landing page
      cannot regress from anything done here.
    -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>blobatar editor — tune one and take the code</title>
    <meta
      name="description"
      content="Tune a blobatar by hand — silhouette, body, eyes, colour — and copy the trait overrides that reproduce it."
    />

    <!--
      Indexable, deliberately. Lighthouse scores per URL, so this page's
      interactivity budget cannot touch the landing page's number, and "avatar
      generator" is a thing worth being findable for. The root-relative URLs
      here are rewritten to absolute ones at build time — see `build.ts`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/editor" />
    <meta property="og:title" content="blobatar editor" />
    <meta
      property="og:description"
      content="Tune a blobatar by hand and copy the trait overrides that reproduce it."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The blobatar landing page: the wordmark, a pale blue blobatar, and the four lines of JSX that render it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@alain_0012" />

    <!--
      Repeated from `index.html` rather than shared, because @font-face is
      per-document and there is nowhere else for it to live: the rules cannot
      move into `styles.css` without Bun's CSS bundler base64-inlining ~188 KB
      of font into the stylesheet. See the longer note on the same block there.
    -->
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/fonts/geist-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/geist-mono-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./editor.tsx"></script>
  </body>
</html>
