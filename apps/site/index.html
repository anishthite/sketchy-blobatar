<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Generated rather than authored, and gitignored — see `favicon.ts`, which
      both the build and the dev server call before anything reads this file.
      Referenced relatively so the bundler hashes it into `dist` and rewrites
      this href; an absolute `/favicon.svg` is a resolve error, not a
      passthrough.
    -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>blobatar — deterministic outlined blobatars</title>
    <meta
      name="description"
      content="Deterministic outlined blobatars from any string. No dependencies, about 4 KB."
    />

    <!--
      The card. `og:image` is a screenshot of the hero rather than a generated
      composition, because the hero already *is* the pitch — wordmark, tagline,
      a blobatar and the code that produced it — and a card that redraws that
      into a poster would say the same thing less credibly.

      The root-relative URLs below are rewritten to absolute ones at build time,
      from the deploy origin — see `build.ts`. Crawlers will not resolve a
      relative one against the page they found it on.

      Written without quoting the attribute pattern the rewrite matches on,
      deliberately: this comment survives into the built HTML, and a literal
      example of it here would be rewritten too.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="blobatar" />
    <meta
      property="og:description"
      content="Deterministic outlined blobatars from any string. No dependencies, about 4 KB."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The blobatar landing page: the wordmark, a pale blue blobatar, and the four lines of JSX that render it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@alain_0012" />
    <!--
      Both faces are preloaded, but the tags are injected by `build.ts` rather
      than written here — see the comment there. Short version: the bundler
      resolves and hashes any font URL it finds in this file, and the @font-face
      rules below deliberately use an unresolvable absolute path, so a preload
      written here would prime a *different* copy than the one the page uses.
    -->

    <!--
      @font-face lives here, inline, rather than in styles.css.

      Bun's CSS bundler resolves and base64-inlines every url() it can reach —
      ~188 KB of font buried in the stylesheet, render-blocking and re-fetched
      on any class change. Marking them external fixes `bun build` but the dev
      server takes no such option, so the two environments disagreed. An inline
      <style> is left alone by both, and the files are served straight from
      /fonts in dev and copied there at build time.
    -->
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/fonts/geist-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/geist-mono-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
